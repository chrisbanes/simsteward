VERSION_NAME=0.0.1

POM_NAME=Simsteward
POM_DESCRIPTION=A Gradle plugin that gives Kotlin Multiplatform simulator tests their own Apple simulators: the build creates them, lends them to test tasks and deletes them when the build ends.
