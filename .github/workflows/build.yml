name: Build

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.name }})
    # Apple silicon: KGP only enables iosSimulatorArm64 tests on a matching host.
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported versions; keep in sync with minGradle/minKgp in build.gradle.kts.
          - name: min
            java: 17
            gradle: "8.14"
            kgp: "2.2.0"
          # Current stable Gradle and KGP.
          - name: latest
            java: 21
            gradle: "9.9.1"
            kgp: "2.4.21"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --no-scan -Psimsteward.test.gradle=${{ matrix.gradle }} -Psimsteward.test.kgp=${{ matrix.kgp }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.name }}
          path: build/reports/tests
